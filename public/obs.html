<!doctype html><html lang="km"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KH TTS OBS</title><style>@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@700;800&display=swap');body{margin:0;background:transparent;font-family:"Noto Sans Khmer";color:white}.alert{display:none;max-width:900px;margin:20px;padding:18px 22px;border-radius:18px;background:#12101ccc;border:1px solid #a779ff;box-shadow:0 0 35px #0008;animation:in .3s}.alert.show{display:block}.amount{color:#c49bff;font-size:13px}@keyframes in{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}</style></head><body><div id="a" class="alert"><div id="m"></div><div id="amt" class="amount"></div></div><script>
const id=new URLSearchParams(location.search).get("streamer");const a=document.querySelector("#a");function show(x){document.querySelector("#m").textContent=x.message||"";document.querySelector("#amt").textContent=x.amount?`Donation ${x.amount} USD`:"";a.classList.add("show");setTimeout(()=>a.classList.remove("show"),7000);if(x.message){let u=new SpeechSynthesisUtterance(x.message);u.lang="km-KH";speechSynthesis.speak(u)}}if(id){let p=location.protocol==="https:"?"wss":"ws";let ws=new WebSocket(`${p}://${location.host}/api/obs?streamer=${encodeURIComponent(id)}`);ws.onmessage=e=>{try{let x=JSON.parse(e.data);if(x.type==="tts")show(x)}catch{}}}
</script></body></html>
